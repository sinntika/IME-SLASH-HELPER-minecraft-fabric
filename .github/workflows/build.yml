name: Build all versions
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25\n17\n21\n"
      - name: Diagnostics
        continue-on-error: true
        run: |
          echo "--- java related env ---"
          env | grep -i -E '^JAVA' | sort || true
          echo "--- default java ---"
          java -version 2>&1 || true
          echo "--- repo tree ---"
          ls -la
          ls -la legacy modern || true
          echo "--- wrapper properties ---"
          cat legacy/gradle/wrapper/gradle-wrapper.properties || true
          cat modern/gradle/wrapper/gradle-wrapper.properties || true
      - name: Set up Gradle 8.12 for legacy
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
          cache-disabled: true
      - name: Build legacy
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -eux
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          gradle --version
          gradle -p legacy --no-daemon --stacktrace collectJars
      - name: Set up Gradle 9.4 for modern
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4"
          cache-disabled: true
      - name: Build modern
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          set -eux
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          gradle --version
          gradle -p modern --no-daemon --stacktrace collectJars
      - name: List artifacts
        if: always()
        run: ls -la dist || true
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-slash-helper-all
          path: dist/*.jar
          if-no-files-found: warn
      - name: Attach jars to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
