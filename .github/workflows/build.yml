name: Build all versions
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
​
jobs:
  build:
    # legacy and modern rewrite the shared src/ tree, so run them
    # sequentially inside a single job. Never parallelize them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
​
      # setup-java sets JAVA_HOME to the LAST version listed.
      # Gradle 8.12 cannot run on JDK 25, so make 21 the default.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            17
            21
​
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        with:
          gradle-version: "8.12"
​
      # Running `gradle wrapper` inside the project would evaluate
      # settings.gradle.kts and resolve Stonecutter/foojay with the wrong
      # Gradle version. Generate the wrapper in an empty directory instead
      # and copy only gradlew + gradle-wrapper.jar, keeping the committed
      # gradle-wrapper.properties (which pins 8.12 and 9.4).
      - name: Bootstrap Gradle wrappers
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -eux
          java -version
          gradle --version
          rm -rf /tmp/wrapper-gen
          mkdir -p /tmp/wrapper-gen
          (cd /tmp/wrapper-gen && gradle --no-daemon wrapper)
          for d in legacy modern; do
            mkdir -p "$d/gradle/wrapper"
            cp /tmp/wrapper-gen/gradlew "$d/gradlew"
            cp /tmp/wrapper-gen/gradlew.bat "$d/gradlew.bat"
            cp /tmp/wrapper-gen/gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar"
            chmod +x "$d/gradlew"
          done
          cat legacy/gradle/wrapper/gradle-wrapper.properties
          cat modern/gradle/wrapper/gradle-wrapper.properties
​
      - name: Build legacy (1.20.x and 1.21.x)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        working-directory: legacy
        run: ./gradlew --no-daemon --stacktrace collectJars
​
      - name: Build modern (26.x)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        working-directory: modern
        run: ./gradlew --no-daemon --stacktrace collectJars
​
      - name: List artifacts
        if: always()
        run: ls -1 dist || true
​
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-slash-helper-all
          path: dist/*.jar
          if-no-files-found: warn
​
      - name: Attach jars to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
​
