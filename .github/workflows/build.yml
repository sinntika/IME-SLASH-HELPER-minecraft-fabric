name: Build all versions

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    # legacy と modern は共通 src/ を書き換えるため、同一 job 内で逐次実行する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs (17 / 21 / 25)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew がコミットされていない場合に自動生成する
      - name: Bootstrap Gradle wrappers
        run: |
          if [ ! -f legacy/gradlew ]; then (cd legacy && gradle wrapper); fi
          if [ ! -f modern/gradlew ]; then (cd modern && gradle wrapper); fi
          chmod +x legacy/gradlew modern/gradlew

      - name: Build legacy (1.20.x / 1.21.x)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: legacy/gradlew -p legacy --no-daemon collectJars

      - name: Build modern (26.x)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: modern/gradlew -p modern --no-daemon collectJars

      - name: List artifacts
        run: ls -1 dist

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: ime-slash-helper-all
          path: dist/*.jar

      # リリースを作ったときは jar を自動で添付する
      - name: Attach jars to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
