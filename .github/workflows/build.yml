name: Build all versions
​
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]
​
jobs:
  build:
    # legacy と modern は共通 src/ を書き換えるため、同一 job 内で逐次実行する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
​
      # 重要: setup-java は「最後に書いたバージョン」を JAVA_HOME にする。
      # Gradle 8.12 は JDK 25 で起動できないので、既定を 21 にしておく。
      - name: Set up JDKs (25 / 17 / 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            17
            21
​
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        with:
          gradle-version: "8.12"
​
      # プロジェクト内で `gradle wrapper` を実行すると settings.gradle.kts が評価され、
      # Stonecutter / foojay プラグインが意図しない Gradle バージョンで解決されて失敗する。
      # 空のディレクトリで wrapper を生成し、gradlew と gradle-wrapper.jar だけをコピーする
      # （distributionUrl はリポジトリ同梱の gradle-wrapper.properties を使うので上書きしない）。
      - name: Bootstrap Gradle wrappers
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -eux
          java -version
          gradle --version
          rm -rf /tmp/wrapper-gen
          mkdir -p /tmp/wrapper-gen
          (cd /tmp/wrapper-gen && gradle --no-daemon wrapper)
          for d in legacy modern; do
            mkdir -p "$d/gradle/wrapper"
            cp /tmp/wrapper-gen/gradlew "$d/gradlew"
            cp /tmp/wrapper-gen/gradlew.bat "$d/gradlew.bat"
            cp /tmp/wrapper-gen/gradle/wrapper/gradle-wrapper.jar "$d/gradle/wrapper/gradle-wrapper.jar"
            chmod +x "$d/gradlew"
          done
          cat legacy/gradle/wrapper/gradle-wrapper.properties
          cat modern/gradle/wrapper/gradle-wrapper.properties
​
      - name: Build legacy (1.20.x / 1.21.x)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew --no-daemon --stacktrace collectJars
        working-directory: legacy
​
      - name: Build modern (26.x)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: ./gradlew --no-daemon --stacktrace collectJars
        working-directory: modern
​
      - name: List artifacts
        if: always()
        run: ls -1 dist || true
​
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-slash-helper-all
          path: dist/*.jar
          if-no-files-found: warn
​
      # リリースを publish したときは jar を自動添付する
      - name: Attach jars to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
