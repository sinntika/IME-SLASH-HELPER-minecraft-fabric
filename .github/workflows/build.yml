name: Build all versions
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25\n17\n21\n"
      - name: Set up Gradle 8.14.3 for legacy
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
          cache-disabled: true
      - name: Build legacy
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set -eux
          gradle --version
          for v in 1.20.1 1.20.4 1.20.6 1.21.1 1.21.4 1.21.8 1.21.11; do
            gradle -p legacy --no-daemon --stacktrace ":$v:build"
          done
      - name: Set up Gradle 9.4 for modern
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4"
          cache-disabled: true
      - name: Build modern
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          set -eux
          gradle --version
          for v in 26.1.2; do
            gradle -p modern --no-daemon --stacktrace ":$v:build"
          done
      - name: Collect jars
        if: always()
        run: |
          set -eux
          mkdir -p dist
          find legacy/versions modern/versions -type f -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" -exec cp -f {} dist/ \; || true
          ls -la dist || true
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-slash-helper-all
          path: dist/*.jar
          if-no-files-found: warn
      - name: Attach jars to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
